# Docker Development Environment
#
# Provides a PHP 8.4 / Apache container and a MariaDB container.
#
# To use the project for the first time, run `php cli.php init`.
# Run `php cli.php start` to start the Docker environment, and
# `php cli.php stop` to stop it.

# DO NOT INSERT THE DEPRECATED `version` KEY. Docker Compose will automatically use the latest version.

services:
    web:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: lampfire-web
        ports:
            - "8080:80"
        volumes:
            - ./app:/var/www/app/app
            - ./framework:/var/www/app/framework
            - ./cli:/var/www/app/cli
            - ./cli.php:/var/www/app/cli.php
            - ./.env:/var/www/app/.env
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    cli:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: lampfire-cli
        volumes:
            - ./app:/var/www/app/app
            - ./framework:/var/www/app/framework
            - ./cli:/var/www/app/cli
            - ./cli.php:/var/www/app/cli.php
            - ./.env:/var/www/app/.env
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        working_dir: /var/www/app
        entrypoint: ["php", "cli.php"]
        profiles:
            - cli

    db:
        image: mariadb:11
        container_name: lampfire-db
        ports:
            - "3306:3306"
        environment:
            MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "0"
            MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-}"
            MARIADB_ROOT_HOST: "%"
        env_file:
            - .env
        volumes:
            - ./docker/mariadb/data:/var/lib/mysql
            - ./docker/mariadb/initdb:/docker-entrypoint-initdb.d
        healthcheck:
            test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 --port 3306 --silent || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

networks:
    default:
        name: "${COMPOSE_PROJECT_NAME}_network"
