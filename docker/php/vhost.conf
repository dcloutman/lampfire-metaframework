# Apache virtual host for the Lampfire development environment.
#
# Routes all requests through Slim's front controller at
# src/public/index.php. Enables .htaccess overrides so Slim's
# URL rewriting works correctly.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/app/app/src/public

    <Directory /var/www/app/app/src/public>
        AllowOverride All
        Require all granted

        # Route all requests to the Slim front controller.
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
